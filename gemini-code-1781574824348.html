<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四川电信天翼政务云应急演练</title>
    <style>
        :root {
            --primary-color: #00f3ff;
            --text-main: #e0f2fe;
            --glass-bg: rgba(10, 15, 30, 0.6);
            --glass-border: rgba(0, 243, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #050914 url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(2,6,23,0.8) 0%, rgba(15,23,42,0.6) 100%);
            z-index: 1;
        }

        .glass-panel {
            position: relative;
            z-index: 2;
            width: 33.33vw; 
            min-width: 750px; 
            max-width: 1400px;
            padding: 60px 70px; 
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 243, 255, 0.1) inset;
            text-align: center;
        }

        h1 {
            font-size: 2.5em; 
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 10px;
            line-height: 1.4;
            text-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            background: -webkit-linear-gradient(180deg, #ffffff, var(--primary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            font-size: 1.2em;
            font-weight: 300;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .clock-container {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5em;
            color: var(--primary-color);
            margin: 30px 0;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sys-info {
            font-size: 0.3em;
            color: #64748b;
            letter-spacing: 1px;
            margin-top: 15px;
            text-transform: uppercase;
            line-height: 1.8;
            text-align: center;
        }

        .ip-highlight {
            color: #a7f3d0;
            text-shadow: 0 0 5px rgba(167, 243, 208, 0.5);
        }

        .terminal {
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 25px;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1em; 
            height: 150px;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .log-line {
            margin: 8px 0; 
            display: none; 
            opacity: 0;
        }

        .log-line.active {
            display: block;
            animation: fadeIn 0.5s forwards;
        }

        .log-line:nth-child(1) { color: #fca5a5; } 
        .log-line:nth-child(2) { color: #ef4444; } 
        .log-line:nth-child(3) { color: #cbd5e1; } 
        .log-line:nth-child(4) { color: var(--primary-color); } 
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--primary-color);
            animation: blink 1s step-end infinite;
            margin-left: 5px;
            vertical-align: middle;
        }

        .control-btn {
            margin-top: 40px;
            padding: 12px 35px;
            font-size: 1.05em;
            font-family: inherit;
            color: var(--primary-color);
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
        }

        .control-btn:hover {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
        }

        .control-btn:disabled {
            color: #64748b;
            border-color: #334155;
            background: transparent;
            cursor: not-allowed;
            text-shadow: none;
            box-shadow: none;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="glass-panel">
        
        <h1>
            <span style="display: block; margin-bottom: 10px;">四川电信天翼政务云</span>
            <span style="display: block;">第二季度应急演练</span>
        </h1>
        <h2>— 系统盘自动备份可恢复性验证 —</h2>

        <div class="clock-container">
            <div id="time-display">00:00:00.000</div>
            <div id="date-display" style="font-size: 0.4em; color: #cbd5e1; margin-top: 10px;">YYYY-MM-DD</div>
            
            <div class="sys-info">
                <div>● NTP Server Synchronized (UTC+8)</div>
                <div>● HOST IP: <span id="ip-address" class="ip-highlight">Detecting...</span></div>
            </div>
        </div>

        <div class="terminal">
            <p class="log-line">> [ALERT] 监测到 Web 服务异常中止，心跳检测失败 (HTTP 404)...</p>
            <p class="log-line">> [FATAL] 侦测到操作系统核心架构损坏，实例失去响应...</p>
            <p class="log-line">> [SYSTEM] 正在下发紧急指令 (Force Power Off)，停止受损实例...</p>
            <p class="log-line">> [CLOUD] 唤醒云端备份仓库，正在从时间长河中回滚系统盘镜像 <span class="cursor"></span></p>
        </div>

        <button class="control-btn" id="step-btn">推进演练进度</button>
    </div>

    <script>
        // 时间静静流淌的倒影
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            document.getElementById('time-display').textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;
            document.getElementById('date-display').textContent = `${year}-${month}-${day}`;
            
            requestAnimationFrame(updateClock);
        }
        requestAnimationFrame(updateClock);

        // ==========================================
        // 在这里，温柔地写下那台即将经历风暴的机器真实的坐标呀♪
        const targetLocalIP = "10.27.158.42"; 
        // ==========================================

        // 模拟一个轻轻寻找的过程，让故事更真实
        setTimeout(() => {
            document.getElementById('ip-address').textContent = targetLocalIP + ' (INTERNAL)';
        }, 1200);

        // 命运齿轮的按钮
        const btn = document.getElementById('step-btn');
        const lines = document.querySelectorAll('.log-line');
        let currentLine = 0;

        btn.addEventListener('click', () => {
            if (currentLine < lines.length) {
                lines[currentLine].classList.add('active');
                currentLine++;
                
                if (currentLine === lines.length) {
                    btn.textContent = '演练指令已全部下发';
                    btn.disabled = true;
                }
            }
        });
    </script>
</body>
</html>
